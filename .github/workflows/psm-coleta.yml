# Gera um retrato semanal das métricas do PSM/CID a partir das issues e do registro de horas.
name: Coletar métricas do PSM/CID

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rodar a coleta
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/psm_coleta.py --repo ${{ github.repository }} | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Versionar o retrato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/gestao/psm-*.csv
          git diff --cached --quiet || git commit -m "PSM/CID: retrato automático de $(date +%F)"
          git push
