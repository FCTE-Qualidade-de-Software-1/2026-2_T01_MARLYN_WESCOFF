site_name: Marlyn Wescoff · Qualidade de Software
site_description: FGA0315 Qualidade de Software 1 - 2026.2 - T01 - Grupo Marlyn Wescoff - Avaliação da qualidade do Moodle 5.3 LTS
site_author: Grupo Marlyn Wescoff
site_url: https://fcte-qualidade-de-software-1.github.io/2026-2_T01_MARLYN_WESCOFF/
repo_url: https://github.com/FCTE-Qualidade-de-Software-1/2026-2_T01_MARLYN_WESCOFF
repo_name: 2026-2_T01_MARLYN_WESCOFF
edit_uri: edit/main/docs/

# Versão e data da GitPage. Atualizar a cada entrega ou mudança relevante.
copyright: "FGA0315 Qualidade de Software 1 · 2026.2 · T01 · Grupo Marlyn Wescoff | Entrega 1 | Versão 1.1 · 26/10/2026"

theme:
  name: material
  custom_dir: overrides
  language: pt-BR
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Ativar tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Ativar tema claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.action.edit
    - content.tabs.link
    - content.tooltips
    - content.code.copy
    - announce.dismiss

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/marlyn.js

watch:
  - overrides
  - includes

plugins:
  - search:
      lang: pt
  - termynal:
      title: "terminal"
      buttons: "macos"
      prompt_literal_start:
        - "$"

markdown_extensions:
  - abbr
  - pymdownx.snippets:
      auto_append:
        - includes/abreviacoes.md
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Início: index.md
  - Metodologia: metodologia.md
  - Fase 1:
      - fase-1/index.md
      - Propósito da avaliação: fase-1/proposito.md
      - Requisitante e partes interessadas: fase-1/partes-interessadas.md
      - Produto avaliado: fase-1/produto.md
      - Modelo de qualidade: fase-1/modelo-de-qualidade.md
      - Seleção e priorização: fase-1/caracteristicas.md
      - Escopo e profundidade: fase-1/escopo.md
      - ODS relacionados: fase-1/ods.md
  - Fase 2:
      - fase-2/index.md
      - Abstraction sheets: fase-2/abstraction-sheets.md
      - Objetivos, questões e hipóteses: fase-2/objetivos-questoes-hipoteses.md
      - Métricas: fase-2/metricas.md
      - Níveis de pontuação e julgamento: fase-2/niveis-e-julgamento.md
      - Diagrama GQM: fase-2/diagrama-gqm.md
      - Rastreabilidade Fase 1 → Fase 2: fase-2/rastreabilidade.md
  - Fases 3 e 4: fases-3-4.md
  - Gestão do projeto:
      - gestao/index.md
      - Plano de medição (PSM/CID): gestao/plano-psm.md
      - Registro de medições: gestao/registro-medicoes.md
      - Atas de reunião: gestao/atas.md
  - Sobre:
      - sobre/index.md
      - Equipe e contribuição: sobre/equipe.md
      - Declaração de uso de IA: sobre/uso-de-ia.md
      - Referências: sobre/referencias.md
      - Entregas e releases: sobre/entregas.md

validation:
  links:
    anchors: warn
